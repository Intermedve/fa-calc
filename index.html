<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faanyag Méretváltozás Kalkulátor</title>
    <style>
        :root {
            --bg-color: #FAFAFA;       /* 60% Off-White Paper */
            --text-color: #2E4031;     /* 30% Forest Moss */
            --brand-color: #6E3B24;    /* Secondary Rich Mahogany */
            --accent-color: #D4A359;   /* 10% Brass Hardware CTA */
            --card-bg: #FFFFFF;
            --input-bg: #FAFAFA;
            --border-color: #D0D7D1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px 12px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
        }

        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 24px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(46, 64, 49, 0.08);
            border: 1px solid rgba(110, 59, 36, 0.15);
        }

        h2 {
            color: var(--brand-color);
            font-size: 1.4rem;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--brand-color);
            padding-bottom: 8px;
        }

        h3 {
            color: var(--brand-color);
            font-size: 1.15rem;
            margin-bottom: 10px;
        }

        h4 {
            color: var(--brand-color);
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-color);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px; /* Mobil automatikus zoom megakadályozása */
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--brand-color);
            box-shadow: 0 0 0 3px rgba(110, 59, 36, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #2E4031;
            font-weight: bold;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #C09248;
        }

        button:active {
            transform: scale(0.99);
        }

        .mode-toggle {
            background: #F0F4F1;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            border-left: 4px solid var(--brand-color);
        }

        .info-note {
            font-size: 0.85rem;
            color: #4A5E4F;
            margin-top: 5px;
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            background: #F4F6F4;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .time-box {
            background: #F7F3EE;
            border-left: 4px solid var(--brand-color);
            padding: 12px 14px;
            margin-top: 14px;
            border-radius: 0 6px 6px 0;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 12px 0;
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .card {
                padding: 16px 12px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Faanyag Méretváltozás Kalkulátor</h2>
    
    <div class="form-group">
        <label for="species">Fafaj kiválasztása:</label>
        <select id="species">
            <optgroup label="Hazai kemény lombos fák">
                <option value="akác" selected>Akác</option>
                <option value="tölgy">Tölgy</option>
                <option value="bükk">Bükk</option>
                <option value="kőris">Kőris</option>
                <option value="juhar">Juhar</option>
                <option value="dió">Dió</option>
            </optgroup>
            <optgroup label="Hazai tűlevelűek">
                <option value="erdeifenyő">Erdeifenyő</option>
                <option value="lucfenyő">Lucfenyő</option>
                <option value="vörösfenyő">Vörösfenyő</option>
            </optgroup>
            <optgroup label="Hazai lágy lombos fák">
                <option value="éger">Éger</option>
                <option value="nyír">Nyír</option>
                <option value="nyár">Nyár</option>
            </optgroup>
            <optgroup label="Egzotikus fák">
                <option value="mahagóni">Mahagóni</option>
                <option value="teak">Teak</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label for="cutType">Fűrészelés típusa / Vágási irány:</label>
        <select id="cutType">
            <option value="tangential">Húrvágott (Flóderos) - Szélesség: Húrirány</option>
            <option value="radial">Sugárvágott (Tükrös) - Szélesség: Sugárirány</option>
            <option value="mixed">Vegyes / Félfriz (45°)</option>
        </select>
    </div>

    <div class="mode-toggle">
        <label for="calcMode">Adatmegadás módja:</label>
        <select id="calcMode" onchange="toggleInputMode()">
            <option value="rh_to_rh">1. Levegő RH% → Levegő RH% (Környezetváltozás)</option>
            <option value="u_to_u">2. Fa U% → Fa U% (Közvetlen fanedvesség)</option>
            <option value="u_to_rh">3. Fa U% → Levegő RH% (Átszállítás új klímára)</option>
        </select>
    </div>

    <div id="inputGroup">
        <div class="form-group" id="field_rh1">
            <label for="rh1">Kezdeti levegő páratartalom (RH1 %):</label>
            <input type="number" id="rh1" value="45" min="10" max="100" oninput="updatePreview()">
            <div class="info-note" id="rh1_preview"></div>
        </div>

        <div class="form-group" id="field_u1" style="display:none;">
            <label for="u1">Kezdeti fa nedvességtartalom (U1 %):</label>
            <input type="number" id="u1" value="8" step="0.1" oninput="updatePreview()">
        </div>

        <div class="form-group" id="field_rh2">
            <label for="rh2">Cél levegő páratartalom (RH2 %):</label>
            <input type="number" id="rh2" value="60" min="10" max="100" oninput="updatePreview()">
            <div class="info-note" id="rh2_preview"></div>
        </div>

        <div class="form-group" id="field_u2" style="display:none;">
            <label for="u2">Cél fa nedvességtartalom (U2 %):</label>
            <input type="number" id="u2" value="20" step="0.1" oninput="updatePreview()">
        </div>
    </div>

    <div class="form-group">
        <label for="length">Hosszúság (mm):</label>
        <input type="number" id="length" value="4000">
    </div>

    <div class="form-group">
        <label for="width">Szélesség (mm):</label>
        <input type="number" id="width" value="100">
    </div>

    <div class="form-group">
        <label for="thickness">Vastagság (mm):</label>
        <input type="number" id="thickness" value="50">
    </div>

    <button onclick="calculate()">Számítás</button>

    <div class="result" id="output" style="display:none;"></div>
</div>

<script>
const woodData = {
    "akác":       { Zr: 0.4, Zs: 3.9, Zh: 5.8, Zt: 10.1, diff: 1.4 },
    "tölgy":      { Zr: 0.4, Zs: 4.0, Zh: 7.8, Zt: 12.2, diff: 1.3 },
    "bükk":       { Zr: 0.3, Zs: 5.8, Zh: 11.8, Zt: 17.9, diff: 1.1 },
    "erdeifenyő": { Zr: 0.4, Zs: 4.0, Zh: 7.7, Zt: 12.1, diff: 0.9 },
    "lucfenyő":   { Zr: 0.3, Zs: 3.6, Zh: 7.8, Zt: 11.7, diff: 0.8 },
    "vörösfenyő": { Zr: 0.3, Zs: 3.3, Zh: 7.8, Zt: 11.4, diff: 1.0 },
    "kőris":      { Zr: 0.2, Zs: 5.0, Zh: 8.0, Zt: 13.2, diff: 1.2 },
    "juhar":      { Zr: 0.4, Zs: 3.0, Zh: 8.0, Zt: 11.5, diff: 1.0 },
    "dió":        { Zr: 0.3, Zs: 5.4, Zh: 7.5, Zt: 13.2, diff: 1.1 },
    "éger":       { Zr: 0.4, Zs: 4.4, Zh: 7.3, Zt: 12.1, diff: 0.9 },
    "nyír":       { Zr: 0.6, Zs: 5.3, Zh: 7.8, Zt: 13.7, diff: 1.0 },
    "nyár":       { Zr: 0.3, Zs: 4.2, Zh: 8.2, Zt: 12.7, diff: 0.7 },
    "mahagóni":   { Zr: 0.2, Zs: 3.2, Zh: 5.2, Zt: 8.6,  diff: 1.0 },
    "teak":       { Zr: 0.2, Zs: 2.6, Zh: 4.7, Zt: 7.5,  diff: 1.2 }
};

function rhToEmc(rh) {
    if (rh <= 0) return 0;
    if (rh >= 100) return 30;
    const points = [
        { rh: 0, u: 0 }, { rh: 20, u: 4.5 }, { rh: 35, u: 6.8 },
        { rh: 45, u: 8.3 }, { rh: 50, u: 9.2 }, { rh: 60, u: 11.0 },
        { rh: 70, u: 13.2 }, { rh: 80, u: 16.2 }, { rh: 85, u: 18.0 },
        { rh: 90, u: 21.0 }, { rh: 100, u: 30.0 }
    ];
    for (let i = 0; i < points.length - 1; i++) {
        if (rh >= points[i].rh && rh <= points[i+1].rh) {
            const t = (rh - points[i].rh) / (points[i+1].rh - points[i].rh);
            return points[i].u + t * (points[i+1].u - points[i].u);
        }
    }
    return 12;
}

function toggleInputMode() {
    const mode = document.getElementById('calcMode').value;
    
    document.getElementById('field_rh1').style.display = (mode === 'rh_to_rh') ? 'block' : 'none';
    document.getElementById('field_u1').style.display  = (mode !== 'rh_to_rh') ? 'block' : 'none';
    document.getElementById('field_rh2').style.display = (mode !== 'u_to_u') ? 'block' : 'none';
    document.getElementById('field_u2').style.display  = (mode === 'u_to_u') ? 'block' : 'none';
    
    updatePreview();
}

function updatePreview() {
    const rh1 = parseFloat(document.getElementById('rh1').value) || 0;
    const rh2 = parseFloat(document.getElementById('rh2').value) || 0;
    document.getElementById('rh1_preview').innerText = `→ Becsült egyensúlyi fanedvesség (U1): ~${rhToEmc(rh1).toFixed(1)}%`;
    document.getElementById('rh2_preview').innerText = `→ Becsült egyensúlyi fanedvesség (U2): ~${rhToEmc(rh2).toFixed(1)}%`;
}

function calculate() {
    const species = document.getElementById('species').value;
    const cutType = document.getElementById('cutType').value;
    const mode = document.getElementById('calcMode').value;
    
    let u1, u2;

    if (mode === 'rh_to_rh') {
        u1 = rhToEmc(parseFloat(document.getElementById('rh1').value));
        u2 = rhToEmc(parseFloat(document.getElementById('rh2').value));
    } else if (mode === 'u_to_u') {
        u1 = parseFloat(document.getElementById('u1').value);
        u2 = parseFloat(document.getElementById('u2').value);
    } else {
        u1 = parseFloat(document.getElementById('u1').value);
        u2 = rhToEmc(parseFloat(document.getElementById('rh2').value));
    }
    
    const L1 = parseFloat(document.getElementById('length').value);
    const W1 = parseFloat(document.getElementById('width').value);
    const T1 = parseFloat(document.getElementById('thickness').value);

    const u1_corr = Math.min(u1, 30);
    const u2_corr = Math.min(u2, 30);
    const deltaU = u2_corr - u1_corr;
    
    const isSwelling = deltaU > 0;
    const data = woodData[species] || { Zr: 0.3, Zs: 4.0, Zh: 7.0, Zt: 12.0, diff: 1.0 };
    
    let Z_width, Z_thickness;
    if (cutType === 'tangential') {
        Z_width = data.Zh; Z_thickness = data.Zs;
    } else if (cutType === 'radial') {
        Z_width = data.Zs; Z_thickness = data.Zh;
    } else {
        Z_width = (data.Zs + data.Zh) / 2;
        Z_thickness = (data.Zs + data.Zh) / 2;
    }

    const dL = L1 * (data.Zr * deltaU) / 3000;
    const dW = W1 * (Z_width * deltaU) / 3000;
    const dT = T1 * (Z_thickness * deltaU) / 3000;

    const L2 = L1 + dL;
    const W2 = W1 + dW;
    const T2 = T1 + dT;

    const minDim = Math.min(W1, T1); 
    const baseDays = 1.5 * Math.pow(minDim / 10, 2) * data.diff;
    const minDays = Math.max(1, Math.round(baseDays * 0.7));
    const maxDays = Math.round(baseDays * 1.4);

    let timeText = (maxDays < 7) ? `${minDays}–${maxDays} nap` : `${Math.round(minDays/7)}–${Math.round(maxDays/7)} hét (${minDays}–${maxDays} nap)`;

    const signStr = isSwelling ? "+" : "";
    const processType = isSwelling ? "Dagadás (Méretnövekedés)" : (deltaU === 0 ? "Nincs méretváltozás" : "Zsugorodás (Méretcsökkenés)");

    const out = document.getElementById('output');
    out.style.display = 'block';
    out.innerHTML = `
        <h3>Eredmények (${species.toUpperCase()}):</h3>
        <p><strong>Folyamat:</strong> ${processType}</p>
        <p><strong>Számított fanedvesség-változás (ΔU):</strong> ${u1.toFixed(1)}% → ${u2.toFixed(1)}% (ΔU = ${deltaU > 0 ? '+' : ''}${deltaU.toFixed(1)}%)</p>
        <hr>
        <p><strong>Hosszúság:</strong> ${L2.toFixed(1)} mm (változás: ${signStr}${dL.toFixed(2)} mm)</p>
        <p><strong>Szélesség:</strong> ${W2.toFixed(1)} mm (változás: ${signStr}${dW.toFixed(2)} mm)</p>
        <p><strong>Vastagság:</strong> ${T2.toFixed(1)} mm (változás: ${signStr}${dT.toFixed(2)} mm)</p>
        
        <div class="time-box">
            <h4>⏱️ Becsült időtartam az egyensúly eléréséig:</h4>
            <p>• <strong>Felületi reakció (1-2 mm):</strong> 1–3 nap</p>
            <p>• <strong>Teljes keresztmetszeti beállás:</strong> kb. <strong>${timeText}</strong></p>
        </div>
    `;
}

toggleInputMode();
</script>

</body>
</html>
